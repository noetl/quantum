name: ci

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tested NoETL and kickmix versions
        run: python -m pip install -r requirements-baseline.txt
      - name: Unit tests and local NoETL playbook
        run: python -m unittest discover -s tests -t .
      - name: Validate playbooks against the public NoETL DSL API
        run: python scripts/validate_playbooks.py
