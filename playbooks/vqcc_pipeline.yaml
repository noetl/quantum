# VQCC baseline. Validated against the live DSL at https://noetl.ai/api/dsl/validate
# on 2026-11-10: server 3.156.0, HTTP 200, valid true, findings empty.
# Revalidated 2026-11-11: POST https://noetl.ai/api/dsl/validate
# server 3.156.2, HTTP 200, valid true, execute_verdict accept, findings empty.
# Revalidated 2026-11-13: same verdict. GET /api/dsl/version reported
# server 3.161.2. The validate body omitted server_version.
# Revalidated again the same day after PYTHONUNBUFFERED=1 python3 -u:
# HTTP 200, valid true, execute_verdict accept, findings empty.
# schema_digest sha256:25071111774314cbf0c83ee9925b53701c2228232574bda3b13b1e27d58b372c
# (2026-11-11 digest was sha256:29b2831fdd2444fab0bbc8915283a22ac86532393111f3a3cdad782bf6b1c4be;
# 2026-11-10 digest was sha256:de6519f1f025dcb0e4743e321cff30e8ac4800d38acaaecf8249c00a13ab9ad6).
# The published local CLI that executes
# this file in CI is noetl 5.3.2, which runs kind: shell / cmds and does not
# execute kind: python. The server grammar accepts both shell and python.
# A workflow must contain a step named start.
#
# Spec: specs/001-noetl-pipeline/spec.md at main
# d47053659fed3b110eb057f58d048ac50bf9ba7d
# Issues: https://github.com/noetl/quantum/issues/2 through /9
#
# Default workload mode is competition: no circuit bytes are written when
# data/ has no baseline, verification is blocked, and leaderboard_score is null.
# Structural mode (--set mode=structural) writes labeled kickmix fixtures
# under runs/ and still does not mark them verified.
apiVersion: noetl.io/v2
kind: Playbook
metadata:
  name: vqcc_pipeline
  path: playbooks/vqcc_pipeline
workload:
  mode: competition
  data_dir: data
  runs_root: runs
  repo_root: "."
  seed: "20261108"
workflow:
  - step: start
    desc: Create a git-ignored run directory and record the spec SHA.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline prepare
          --mode "{{ workload.mode }}"
          --data-dir "{{ workload.data_dir }}"
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
          --seed "{{ workload.seed }}"
    next:
      - step: check_data

  - step: check_data
    desc: Report whether data/verifiers is on disk. Absence is a block, not a pass.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline check-data
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: adapt_invsqrt

  - step: adapt_invsqrt
    desc: Import an invsqrt baseline if one exists, or write nothing.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline adapt
          --task invsqrt
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: adapt_dqi

  - step: adapt_dqi
    desc: Import a dqi baseline if one exists, or write nothing.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline adapt
          --task dqi
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: adapt_dfthcsos

  - step: adapt_dfthcsos
    desc: Import a dfthcsos directory if one exists, or write nothing.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline adapt
          --task dfthcsos
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: verify_invsqrt

  - step: verify_invsqrt
    desc: Official invsqrt verifier. Missing scripts block; they do not pass.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline verify-official
          --task invsqrt
          --seed "{{ workload.seed }}"
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: verify_dqi

  - step: verify_dqi
    desc: Official dqi verifier, after invsqrt. The sample circuit is large.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline verify-official
          --task dqi
          --seed "{{ workload.seed }}"
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: verify_dfthcsos

  - step: verify_dfthcsos
    desc: Official dfthcsos verifier. No extra flags that weaken the check.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline verify-official
          --task dfthcsos
          --seed "{{ workload.seed }}"
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: cost

  - step: cost
    desc: >-
      Use an official verifier JSON score when that run marked it authoritative
      (spec FR-004). Otherwise price invsqrt from kickmix counts. Leave
      leaderboard_score null (FR-008, FR-009, FR-016).
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline cost
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: package

  - step: package
    desc: Refuse a submission zip while any task is unverified.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline package
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
    next:
      - step: record

  - step: record
    desc: Write provenance.json. Do not append an invented experiments row.
    tool:
      kind: shell
      cmds:
        - >-
          cd "{{ workload.repo_root }}" && PYTHONUNBUFFERED=1 python3 -u -m vqcc.pipeline record
          --runs-root "{{ workload.runs_root }}"
          --repo-root "{{ workload.repo_root }}"
